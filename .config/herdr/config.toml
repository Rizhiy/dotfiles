# Herdr configuration modelled after ~/.config/tmux/tmux.conf.
onboarding = false

[theme]
name = "gruvbox"

[terminal]
default_shell = "/usr/bin/zsh"
shell_mode = "login"
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[keys]
# Match the existing tmux prefix.
prefix = "ctrl+t"

# tmux window/tab lifecycle and navigation.
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "ctrl+alt+h"]
next_tab = ["prefix+n", "ctrl+alt+l"]
move_tab_previous = "ctrl+alt+left"
move_tab_next = "ctrl+alt+right"
switch_tab = "prefix+1..9"
close_tab = "prefix+ampersand"
detach = "prefix+d"
reload_config = "prefix+r"

# Match tmux's | and - split bindings.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
last_pane = "prefix+semicolon"
copy_mode = "prefix+["
zoom = ["prefix+z", "ctrl+alt+space"]

# The tmux config uses prefix+h/j/k/l for resizing.
resize_mode = ""
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"

# Match vim-tmux-navigator's direct Alt+h/j/k/l pane movement.
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "~/.bin/open_project.sh"
description = "open project"
width = "80%"
height = "80%"

[ui]
prompt_new_tab_name = false
sidebar_width = 32
sidebar_min_width = 24
sidebar_max_width = 44
sidebar_start_collapsed = false
sidebar_collapsed_mode = "compact"

# Keep the content area close to the borderless tmux layout.
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

# The bottom tab row doubles as the tmux-style status line.
tab_bar_position = "bottom"
hide_tab_bar_when_single_tab = false
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 1, timeout_seconds = 2 },
  { type = "datetime", format = "%Y-%m-%d %H:%M:%S" },
]
tab_bar_right_separator = " | "

# Put agents needing attention first and use explicit state symbols.
agent_panel_sort = "priority"
status_indicators = "symbols"
window_title = "{hostname}: {workspace} · {tab} · {terminal_title}"

[ui.sidebar.agents]
row_gap = 0
# User-message hooks keep these tokens current for Pi, Claude, and Codex.
# Each token is clipped to its single sidebar row rather than wrapped.
rows = [
  ["state_icon", "$session_title"],
  ["$cwd"],
]

[ui.sidebar.spaces]
row_gap = 0
# Keep the space/worktree section compact rather than presenting another
# multi-line window list.
rows = [["state_icon", "workspace", "branch", "git_status"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = false
